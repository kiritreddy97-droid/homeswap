# Render Blueprint: one click deploy of API + Postgres. See docs/08-cloud-deploy.md
services:
  - type: web
    name: homeswap-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Staging until an SMS/email OTP provider is wired in: ENV=production refuses to boot with the console OTP
      # sender (it logs login codes). Switch to production once OTP_SENDER is a real provider.
      - key: ENV
        value: staging
      - key: OTP_SENDER
        value: console
      - key: JWT_SECRET
        generateValue: true
      # Owner sets these in the Render dashboard (never commit them):
      - key: ADMIN_CONTACTS # comma-separated emails/phones that become admins on first login
        sync: false
      - key: KYC_WEBHOOK_SECRET # shared secret agreed with the KYC provider
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: homeswap-db
          property: connectionString
databases:
  - name: homeswap-db
    plan: free

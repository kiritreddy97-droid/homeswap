# Render Blueprint: one click deploy of API + Postgres. See docs/08-cloud-deploy.md
services:
  - type: web
    name: homeswap-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeswap-db
          property: connectionString
databases:
  - name: homeswap-db
    plan: free
